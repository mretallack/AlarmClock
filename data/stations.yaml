# Internet radio station catalogue (design.md §10.4, task A4)
#
# Consumed by the firmware and tools/mqtt_sim.py. "Feed only radio stations":
# HA's `select.station` is populated from this list.
#
# Preferences for reliability on the ESP32 (see design.md §10.2):
#   - direct MP3 (or AAC) ICY/Icecast streams
#   - plain HTTP where possible (HTTPS costs RAM/CPU on the S3)
#   - avoid HLS/DASH (not supported by the ESP audio stack)
#
# NOTE: URLs are examples and MUST be verified/curated on-device in Phase B3.
# Update freely; the list is data, not code.

stations:
  - id: somafm-groovesalad
    name: Groove Salad
    url: http://ice1.somafm.com/groovesalad-128-mp3
    codec: mp3
    bitrate: 128

  - id: somafm-lush
    name: Lush
    url: http://ice1.somafm.com/lush-128-mp3
    codec: mp3
    bitrate: 128

  - id: somafm-dronezone

# =============================================================================
# AlarmClock — ESPHome firmware (DRAFT, Track A: no hardware required)
# =============================================================================
# Scope of this draft: Wi-Fi/MQTT/time plumbing + the alarm & radio ENTITIES
# and alarm LOGIC. Display/touch/audio hardware config is stubbed at the end
# (# TODO(hardware)) and wired up during bring-up (tasks.md Phase B).
#
# The `device_id` is derived from the MAC at runtime in the target design; for
# ESPHome (which names the node at *compile* time) we substitute it here for now.
# See firmware/README.md for the topic-naming note.
#
# Validate:  esphome config firmware/alarmclock.yaml
# Build:     esphome compile firmware/alarmclock.yaml
# Flash:     esphome run firmware/alarmclock.yaml
# =============================================================================

substitutions:
  device_id: "48e620"          # last 6 hex of the MAC (this unit; set per unit)
  device_name: "alarmclock-${device_id}"
  friendly_name: "Alarm Clock"
  fw_version: "0.1.0-dev"

  # --- Stations (KEEP IN SYNC with data/stations.yaml) ---
  # Embedded at build time; the select options + URL mapping below are generated
  # from these. Must return Content-Type: audio/mpeg WITHOUT a User-Agent.
  # (A future enhancement: build/generate this from the YAML file.)
  st1_name: "Radio Paradise"
  st1_url: "http://stream.radioparadise.com/mp3-128"
  st2_name: "Classic FM"
  st2_url: "http://media-ice.musicradio.com/ClassicFMMP3"
  st3_name: "Heart London"
  st3_url: "http://icecast.thisisdax.com/HeartLondonMP3"
  st4_name: "Capital FM"
  st4_url: "http://icecast.thisisdax.com/CapitalMP3"
  st5_name: "Smooth London"
  st5_url: "http://icecast.thisisdax.com/SmoothLondonMP3"
  st6_name: "LBC"
  st6_url: "http://icecast.thisisdax.com/LBCUKMP3"
  # --- Dorset (verified 2026-11-20: Content-Type audio/mpeg, no User-Agent) ---
  st7_name: "Heart Dorset"
  st7_url: "http://icecast.thisisdax.com/HeartDorsetMP3"
  st8_name: "Capital South Coast"
  st8_url: "http://icecast.thisisdax.com/CapitalSouthCoastMP3"
  st9_name: "Smooth South Coast"
  st9_url: "http://icecast.thisisdax.com/SmoothHampshireMP3"
  st10_name: "Dorset Coast Radio"
  st10_url: "http://uksoutha.streaming.broadcast.radio:24930/DorsetCoastRadio"
  st11_name: "Hot Radio"
  st11_url: "http://stream1.hippynet.co.uk:8095/dorset"
  st12_name: "Forest FM"
  st12_url: "http://radio.canstream.co.uk:8146/live.mp3"

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  comment: "HA-integrated Internet radio alarm clock"
  # --- ES8311 cold-boot self-heal -------------------------------------------
  # On a COLD power-up the ES8311 codec can fail to probe over I2C
  # (es8311.audio_dac "is marked FAILED"): its setup() writes ~12 registers and
  # mark_failed()s on the first failed write, with NO retry for the rest of the
  # boot. The alarm then turns the radio on and stays SILENT -- the worst
  # failure mode for an alarm clock. A software (warm) reboot always re-inits
  # the codec, so: after all components have set up, if the codec is failed,
  # reboot once (guarded against a reboot loop by a persisted counter).
  #
  # priority -100 == setup_priority::LATE: runs after the i2c bus (BUS=1000)
  # and after es8311/touchscreen (DATA=600) have finished setup().
  on_boot:
    priority: -100
    then:
      - lambda: |-
          if (!id(es8311_dac).is_failed()) {
            // Codec healthy (the warm-boot case). Reset the loop guard so a
            // future cold boot still gets its retries.
            if (id(g_boot_retries) != 0)
              id(g_boot_retries) = 0;
            return;
          }
          id(g_boot_retries) += 1;
          if (id(g_boot_retries) <= 2) {
            ESP_LOGE("main",
                     "ES8311 failed to init (cold-boot race); warm reboot to "
                     "recover audio (attempt %d/2)", id(g_boot_retries));
            App.safe_reboot();
          } else {
            ESP_LOGE("main",
                     "ES8311 STILL failed after %d warm reboots; staying up but "
                     "audio is dead", id(g_boot_retries));
          }

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

# Native API is optional (we integrate via MQTT) but handy for logs/OTA/HA.
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# --- Voice agent control channel (PC <-> device) ---------------------------
# A dumb PC-side agent talks to the clock over plain-text UDP.
#   PC -> device :5006  "LISTEN" | "STOP" | "PLAY <url>" | "PING"
#   device -> PC :5005  raw PCM, 48 kHz, 16-bit, mono (mic uplink)
# The mic and speaker share ONE I2S bus (no full duplex), so the device stops
# the mic before it plays a reply. The PC drives the state machine.
udp:
  - id: voice_cmd_udp
    port:
      listen_port: 5006
      broadcast_port: 5006
    addresses:
      - 10.0.0.78
    on_receive:
      - lambda: |-
          std::string cmd(reinterpret_cast<const char *>(data.data()), data.size());
          while (!cmd.empty() && (cmd.back() == '\n' || cmd.back() == '\r')) {
            cmd.pop_back();
          }
          ESP_LOGI("voice", "UDP command: %s", cmd.c_str());
          id(g_voice_cmd) = cmd;
          if (cmd.rfind("PLAY ", 0) == 0) {
            id(g_voice_url) = cmd.substr(5);
          }
      - if:
          condition:
            lambda: 'return id(g_voice_cmd) == "LISTEN";'
          then:
            - switch.turn_on: sw_voice_agent
      - if:
          condition:
            lambda: 'return id(g_voice_cmd) == "STOP";'
          then:
            - switch.turn_off: sw_voice_agent
      - if:
          condition:
            lambda: 'return id(g_voice_cmd).rfind("PLAY ", 0) == 0;'
          then:
            - switch.turn_off: sw_voice_agent
            - delay: 120ms
            - media_player.play_media:
                id: radio_player
                media_url: !lambda 'return id(g_voice_url);'
                announcement: true
      - if:
          condition:
            lambda: 'return id(g_voice_cmd) == "PING";'
          then:
            - lambda: ESP_LOGI("voice", "PING ok");
            - udp.write:
                id: voice_audio_udp
                data: "PING"
            - lambda: ESP_LOGI("voice", "udp.write returned");

  # Audio uplink: PCM frames from the microphone go straight to the PC.
  - id: voice_audio_udp
    port: 5005
    addresses:
      - 10.0.0.78

# --- Connectivity / provisioning (design.md §14.1) -------------------------
improv_serial:                    # first-time Wi-Fi over USB serial (no app)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # DHCP (dynamic IP) — no manual_ip block. Assign a reserved/static lease in
  # the router if a stable address is wanted (design.md §14.1).
  ap:                             # fallback hotspot
    ssid: "AlarmClock-${device_id}"
    password: !secret wifi_ap_password

captive_portal:                   # fallback / re-provisioning

# --- MQTT (HA integration) -------------------------------------------------
# NOTE: ESPHome manages its own MQTT topics/discovery, namespaced by the node
# name (${device_name} = alarmclock-<id>), so multiple clocks never collide.
# docs/mqtt-interface.md is the canonical contract for the simulator / a future
# hand-written implementation; see firmware/README.md.
mqtt:
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discovery_prefix: homeassistant
  birth_message:
    topic: "${device_name}/status"
    payload: online
  will_message:
    topic: "${device_name}/status"
    payload: offline
  # --- Alarm time as a proper HA time entity (ISO format) -------------------
  # ESPHome's built-in MQTT time entity uses JSON, which HA's MQTT `time`
  # platform doesn't speak, so we publish the discovery ourselves using HA's
  # default ISO "HH:MM:SS" payloads in both directions.
  on_connect:
    # NB: ESPHome fires on_connect from the MQTT event task *before* is_connected()
    # flips true in loop(); publishing here immediately is silently dropped. A
    # short delay lets the connection settle first.
    - delay: 2s
    - mqtt.publish:
        topic: homeassistant/time/${device_name}/alarm_time/config
        retain: true
        payload: !lambda |-
          std::string mac = esphome::get_mac_address();
          std::string node = "${device_name}";
          std::string dev = "\"dev\":{\"ids\":\"" + mac + "\",\"name\":\"Alarm Clock\"}";
          return std::string("{\"name\":\"Alarm time\",\"stat_t\":\"" + node +
                             "/time/alarm_time/state\",\"cmd_t\":\"" + node +
                             "/time/alarm_time/command\",\"avty_t\":\"" + node +
                             "/status\",\"uniq_id\":\"ESPtimealarm_time\"," + dev + "}");
    - script.execute: publish_alarm_time
  on_message:
    - topic: ${device_name}/time/alarm_time/command
      then:
        # Accept HA's ISO "HH:MM:SS" (and tolerate a JSON object defensively).
        - lambda: |-
            std::string p = x;
            int h = -1, m = 0, s = 0;
            if (!p.empty() && p[0] == '{') {
              // {"hour":15,"minute":46,"second":0}
              h = atoi(strstr(p.c_str(), "\"hour\"") ? strstr(p.c_str(), "\"hour\"") + 7 : "-1");
              m = atoi(strstr(p.c_str(), "\"minute\"") ? strstr(p.c_str(), "\"minute\"") + 9 : "0");
              s = atoi(strstr(p.c_str(), "\"second\"") ? strstr(p.c_str(), "\"second\"") + 9 : "0");
            } else {
              sscanf(p.c_str(), "%d:%d:%d", &h, &m, &s);
            }
            if (h >= 0 && h <= 23 && m >= 0 && m <= 59 && s >= 0 && s <= 59) {
              id(dt_alarm_time).make_call().set_time((uint8_t) h, (uint8_t) m, (uint8_t) s).perform();
            }

# --- Time ------------------------------------------------------------------
time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/London"

# --- Shared state (persisted to NVS) --------------------------------------
globals:
  - id: g_alarm_enabled
    type: bool
    restore_value: true
    initial_value: "false"
  - id: g_alarm_hour
    type: int
    restore_value: true
    initial_value: "7"
  - id: g_alarm_minute
    type: int
    restore_value: true
    initial_value: "0"
  - id: g_alarm_days
    type: std::string
    restore_value: true
    initial_value: '"daily"'
  - id: g_alarm_state
    type: std::string
    restore_value: false
    initial_value: '"idle"'   # idle|ringing|snoozed|disabled
  - id: g_snooze_until
    type: int
    restore_value: false
    initial_value: "0"        # epoch seconds when a snoozed alarm should re-ring
  - id: g_last_fired_target
    type: int
    restore_value: true
    initial_value: "0"        # epoch of the last scheduled fire time (guards DST
                              # fall-back + reboot double-fire; changes per alarm)
  - id: g_station_idx
    type: int
    restore_value: true
    initial_value: "0"
  - id: g_radio_on
    type: bool
    restore_value: true
    initial_value: "false"
  - id: g_boot_retries
    type: int
    restore_value: true
    initial_value: "0"        # ES8311 cold-boot self-heal guard (see on_boot);
                              # persists across the reboot so we never loop
  - id: g_voice_cmd
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: g_voice_url
    type: std::string
    restore_value: false
    initial_value: '""'

# --- Alarm entities --------------------------------------------------------
switch:
  - platform: template
    name: "Alarm enabled"
    id: sw_alarm_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(g_alarm_enabled) = true;  id(g_alarm_state) = "idle";
    on_turn_off:
      - lambda: id(g_alarm_enabled) = false; id(g_alarm_state) = "disabled";
  - platform: template
    name: "Radio"
    id: sw_radio
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - media_player.turn_on: radio_player
      - script.execute: play_station
    on_turn_off:
      - media_player.stop: radio_player
  # Voice agent: the mic and speaker share one I2S bus, so arming the mic
  # stops the radio first. The PC drives this over UDP (LISTEN/STOP).
  - platform: template
    name: "Voice Agent"
    id: sw_voice_agent
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          ESP_LOGI("voice", "voice agent ON: stopping radio");
      - switch.turn_off: sw_radio
      - media_player.stop: radio_player
      - lambda: |-
          id(g_radio_on) = false;
      - delay: 200ms
      - lambda: |-
          ESP_LOGI("voice", "starting mic capture");
      - microphone.capture: mic
      - lambda: |-
          ESP_LOGI("voice", "mic capture requested");
    on_turn_off:
      - lambda: |-
          ESP_LOGI("voice", "voice agent OFF: stopping mic");
      - microphone.stop_capture: mic
  # Speaker amplifier enable (PA_CTRL). Internal; on while the device runs.
  - platform: gpio
    id: sw_pa
    internal: true
    pin: GPIO7
    restore_mode: ALWAYS_ON

datetime:
  # NB: kept internal because HA's MQTT `time` entity speaks ISO "HH:MM:SS",
  # whereas ESPHome's own MQTT time component speaks JSON ({"hour","minute",
  # "second"}) — the two are incompatible, so HA->device sets were silently
  # dropped (JSON parse error) and device->HA state was unreadable. We publish
  # our own ISO-format MQTT time entity instead (see the `mqtt:` block below).
  - platform: template
    name: "Alarm time"
    id: dt_alarm_time
    internal: true
    type: time
    optimistic: true
    initial_value: "07:00:00"
    restore_value: true
    on_value:
      - lambda: |-
          id(g_alarm_hour) = x.hour;
          id(g_alarm_minute) = x.minute;
      # Report the new value to HA (ISO "HH:MM:SS").
      - script.execute: publish_alarm_time

select:
  - platform: template
    name: "Alarm repeat"
    id: sel_alarm_days
    optimistic: true
    options: ["off", "once", "daily", "weekdays", "weekends", "custom"]
    initial_option: "daily"
    restore_value: true
    on_value:
      - lambda: id(g_alarm_days) = x;
  - platform: template
    name: "Station"
    id: sel_station
    optimistic: true
    restore_value: true
    options:
      - "${st1_name}"
      - "${st2_name}"
      - "${st3_name}"
      - "${st4_name}"
      - "${st5_name}"
      - "${st6_name}"
      - "${st7_name}"
      - "${st8_name}"
      - "${st9_name}"
      - "${st10_name}"
      - "${st11_name}"
      - "${st12_name}"
    initial_option: "${st1_name}"
    on_value:
      # Changing station while the radio is on re-tunes immediately.
      - if:
          condition:
            switch.is_on: sw_radio
          then:
            - script.execute: play_station

number:
  - platform: template
    name: "Snooze (min)"
    id: num_snooze
    optimistic: true
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 10
    restore_value: true
  - platform: template
    name: "Alarm catch-up (min)"
    id: num_catchup
    optimistic: true
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 10
    restore_value: true
  - platform: template
    name: "Volume"
    id: num_volume
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 30
    restore_value: true
    on_value:
      - media_player.volume_set:
          id: radio_player
          volume: !lambda "return x / 100.0f;"

button:
  - platform: template
    name: "Snooze"
    on_press:
      - switch.turn_off: sw_radio
      - lambda: |-
          id(g_alarm_state) = "snoozed";
          id(g_snooze_until) =
              (int) id(sntp_time).now().timestamp + (int) id(num_snooze).state * 60;
  - platform: template
    name: "Dismiss"
    on_press:
      - script.execute: dismiss_alarm
  - platform: template
    name: "Next station"
    on_press:
      - select.operation:
          id: sel_station
          operation: NEXT
  - platform: template
    name: "Previous station"
    on_press:
      - select.operation:
          id: sel_station
          operation: PREVIOUS

text_sensor:
  - platform: template
    name: "Alarm state"
    id: ts_alarm_state
    update_interval: 5s
    lambda: return {id(g_alarm_state)};
  - platform: template
    name: "Now playing"
    id: ts_now_playing
    update_interval: 10s
    lambda: |-
      return id(g_radio_on) ? id(sel_station).current_option().str() : std::string("");
  - platform: template
    name: "Firmware"
    entity_category: diagnostic
    update_interval: 1h
    lambda: |-
      return std::string("${fw_version}");
  - platform: template
    name: "Device id"
    entity_category: diagnostic
    update_interval: 1h
    lambda: |-
      // Last 6 hex of the Wi-Fi MAC, lowercase — the per-device id (design.md §9.1).
      std::string mac = esphome::get_mac_address();  // 12 lowercase hex chars
      return mac.substr(mac.size() - 6);

binary_sensor:
  - platform: status
    name: "MQTT"        # connectivity (also: ESPHome 'Status')
  # Surfaces the silent-failure mode: a failed ES8311 means no audio path at all.
  # The alarm would ring with the radio "on" but silent. This flag (and the
  # self-heal above) make that state visible/automatic in HA.
  - platform: template
    name: "Audio ok"
    id: bs_audio_ok
    entity_category: diagnostic
    lambda: |-
      return !id(es8311_dac).is_failed();

sensor:
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic

# --- Alarm engine (fires on-device, independent of HA) ---------------------
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(sntp_time).now().is_valid()) return;
          auto now = id(sntp_time).now();
          auto d = id(g_alarm_days);
          bool day_ok = true;
          if (d == "off") day_ok = false;
          else if (d == "weekdays") day_ok = (now.day_of_week >= 2 && now.day_of_week <= 6);
          else if (d == "weekends") day_ok = (now.day_of_week == 1 || now.day_of_week == 7);

          bool fire = false;
          if (id(g_alarm_state) == "snoozed") {
            // re-ring once the snooze window has elapsed
            if (id(g_snooze_until) > 0 && (int) now.timestamp >= id(g_snooze_until)) {
              id(g_snooze_until) = 0;
              fire = true;
            }
          } else if (id(g_alarm_enabled) && day_ok && id(g_alarm_state) == "idle") {
            // Seconds since local midnight + the epoch of local midnight today.
            long now_sod = (long) now.hour * 3600 + (long) now.minute * 60
                           + (long) now.second;
            long day_start = (long) now.timestamp - now_sod;
            long target = day_start + (long) id(g_alarm_hour) * 3600
                          + (long) id(g_alarm_minute) * 60;
            int catchup = (int) id(num_catchup).state * 60;
            // Fire once we're at/after the target and still inside the catch-up
            // window (so a brief power cut or a late NTP sync after boot doesn't
            // miss the alarm), and only once per day (DST fall-back + reboot).
            if (now.timestamp >= target && now.timestamp < target + catchup
                && id(g_last_fired_target) != (int) target) {
              id(g_last_fired_target) = (int) target;
              fire = true;
            }
          }

          if (fire) {
            id(g_alarm_state) = "ringing";
            ESP_LOGI("alarm", "ALARM RINGING");
            id(ring_alarm)->execute();   // start radio + gentle volume ramp
          }

# --- Audio: ES8311 + speaker + internet-radio player (design.md §10) ---------
# ESP-IDF only. I2S -> ES8311 DAC -> PA -> speaker. The media_player decodes
# MP3/FLAC/OPUS/WAV streams; we drive it from the MQTT `Radio` switch / `Station`
# select / `Volume` number. Pin map per design.md §3.2.
i2c:
  id: i2c_bus
  sda: GPIO42
  scl: GPIO41
  scan: false

# Enable the audio codecs we stream. ESPHome only compiles the codecs listed
# here; without MP3 listed, internet-radio MP3 streams fail with
# ESP_ERR_NOT_SUPPORTED (the reader can't detect the file type).
audio:
  codecs:
    mp3:
    flac:
    wav:

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO8

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus
    bits_per_sample: 16bit
    sample_rate: 48000

# The microphone array is wired to the ES7210 4-ch ADC, NOT the ES8311's analog
# mic input. Without this block the ES7210 stays powered down and drives
# nothing onto I2S DIN, so the microphone streams exact digital zeros.
# Note: keep tdm unset — ESPHome's i2s_audio microphone does not configure
# TDM receive; mics 1/2 come out on SDOUT1, which is what this board uses.
audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: i2c_bus
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 48000
    mic_gain: 24dB

speaker:
  - platform: i2s_audio
    id: spk_i2s
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO12
    dac_type: external
    channel: mono
    sample_rate: 48000
    bits_per_sample: 16bit
    audio_dac: es8311_dac
  # Two pipelines (announcement + media) must feed unique speakers -> mix them.
  - platform: mixer
    id: spk_mixer
    output_speaker: spk_i2s
    source_speakers:
      - id: spk_mix_ann
      - id: spk_mix_media
  - platform: resampler
    id: spk_resample_media
    output_speaker: spk_mix_media
  - platform: resampler
    id: spk_resample_ann
    output_speaker: spk_mix_ann

media_player:
  - platform: speaker
    id: radio_player
    name: "Radio"
    volume_initial: 30%
    buffer_size: 500000
    task_stack_in_psram: true
    media_pipeline:
      speaker: spk_resample_media
      num_channels: 1
    announcement_pipeline:
      speaker: spk_resample_ann
      num_channels: 1
    on_turn_on:
      - lambda: id(g_radio_on) = true;
    on_turn_off:
      - lambda: id(g_radio_on) = false;

# --- Microphone: ES7210 ADC over the shared I2S bus (voice agent) ----------
# The mic array is on the ES7210 (see the audio_adc block above); the ES8311
# is the DAC/speaker path only. The mic and speaker share i2s_out, so only one
# may run at a time. The PC stops the mic before asking for a reply. PCM goes
# straight to the PC over UDP.
microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_out
    i2s_din_pin: GPIO11
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 16bit
    # The speaker runs mono on the ES8311's LEFT slot; reading the right slot
    # returns digital silence. Match the speaker's slot.
    channel: left
    on_data:
      - lambda: |-
          static uint32_t chunks = 0;
          chunks++;
          if (chunks == 1 || chunks % 100 == 0) {
            ESP_LOGI("voice", "mic chunk %u: %u bytes", (unsigned) chunks, (unsigned) x.size());
          }
      - udp.write:
          id: voice_audio_udp
          data: !lambda 'return x;'

# --- Touch: CST816T (i2c, int 48, rst 47) -----------------------------------
# Tap anywhere to cancel a ringing alarm (and stop the radio). This makes
# alarm cancellation independent of Home Assistant.
#
# NOTE: declared *after* the audio stack on purpose. At equal setup priority
# ESPHome initialises components in registration order, so putting the
# touchscreen last ensures the ES8311 codec is probed on a quiet I2C bus.
# (The CST816T resets and can hold SCL during its own bring-up.)
touchscreen:
  - platform: cst816
    id: touch_panel
    i2c_id: i2c_bus
    interrupt_pin: GPIO48
    reset_pin: GPIO47
    # address: 0x15  # (default)
    on_touch:
      - if:
          condition:
            - lambda: 'return id(g_alarm_state) == "ringing" || id(g_alarm_state) == "snoozed";'
          then:
            - script.execute: dismiss_alarm
          else:
            - if:
                condition:
                  switch.is_on: sw_radio
                then:
                  - switch.turn_off: sw_radio

script:
  # Cancel the alarm: stop playback and clear the ringing/snooze state (shared by
  # the HA Dismiss button and the on-device touchscreen tap).
  - id: dismiss_alarm
    mode: restart
    then:
      - switch.turn_off: sw_radio
      - lambda: |-
          id(g_alarm_state) = id(g_alarm_enabled) ? "idle" : "disabled";
          id(g_snooze_until) = 0;
  # Wake-up: turn on the radio and ramp the volume up gently to the HA-set level.
  - id: ring_alarm
    mode: restart
    then:
      - switch.turn_on: sw_radio            # powers the media player + starts the station
      # Gentle wake ramp, relative to the HA-set volume (never jumps painfully
      # loud, never sticks at a barely-audible level). 40% -> 70% -> target in 12s.
      - media_player.volume_set:
          id: radio_player
          volume: !lambda |-
            float t = id(num_volume).state / 100.0f;
            if (t < 0.15f) t = 0.15f;
            return t * 0.4f;
      - delay: 6s
      - media_player.volume_set:
          id: radio_player
          volume: !lambda |-
            float t = id(num_volume).state / 100.0f;
            if (t < 0.15f) t = 0.15f;
            return t * 0.7f;
      - delay: 6s
      - media_player.volume_set:
          id: radio_player
          volume: !lambda |-
            float t = id(num_volume).state / 100.0f;
            if (t < 0.15f) t = 0.15f;
            return t;
  # Publish the current alarm time to HA in ISO "HH:MM:SS" (see the datetime /
  # mqtt blocks for why we don't use ESPHome's JSON MQTT time entity).
  - id: publish_alarm_time
    then:
      - mqtt.publish:
          topic: ${device_name}/time/alarm_time/state
          retain: true
          payload: !lambda |-
            auto *t = id(dt_alarm_time);
            char buf[9];
            snprintf(buf, sizeof(buf), "%02d:%02d:%02d", (int) t->hour, (int) t->minute, (int) t->second);
            return std::string(buf);
  # Re-tune to whatever `sel_station` currently is.
  - id: play_station
    then:
      - media_player.play_media:
          id: radio_player
          media_url: !lambda |-
            std::string s = id(sel_station).current_option();
            if (s == "${st1_name}") return std::string("${st1_url}");
            if (s == "${st2_name}") return std::string("${st2_url}");
            if (s == "${st3_name}") return std::string("${st3_url}");
            if (s == "${st4_name}") return std::string("${st4_url}");
            if (s == "${st5_name}") return std::string("${st5_url}");
            if (s == "${st6_name}") return std::string("${st6_url}");
            if (s == "${st7_name}") return std::string("${st7_url}");
            if (s == "${st8_name}") return std::string("${st8_url}");
            if (s == "${st9_name}") return std::string("${st9_url}");
            if (s == "${st10_name}") return std::string("${st10_url}");
            if (s == "${st11_name}") return std::string("${st11_url}");
            if (s == "${st12_name}") return std::string("${st12_url}");
            return std::string("");

# --- Display: on-screen clock (design.md §12.1) -----------------------------
# ST7789V2 240x240 over SPI. Renders HH:MM from sntp_time — the *same* clock
# that drives the alarm engine — plus the date and an alarm status line.
# Compiles without hardware; only the pixels are confirmed at bring-up (B1/B5).
spi:
  clk_pin: GPIO38
  mosi_pin: GPIO39

font:
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_clock
    size: 88
    glyphs: "0123456789:-"
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_info
    size: 16
    glyphs: "0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz .,-+/"

display:
  - platform: st7789v
    model: CUSTOM
    height: 240
    width: 240
    offset_height: 0
    offset_width: 0
    cs_pin: GPIO21
    dc_pin: GPIO45
    reset_pin: GPIO40
    backlight_pin: GPIO46
    update_interval: 1s
    lambda: |-
      auto now = id(sntp_time).now();
      it.fill(Color::BLACK);
      if (!now.is_valid()) {
        // NTP not synced yet — show placeholders, never a bogus time.
        it.printf(120, 80, id(font_clock), Color::WHITE, TextAlign::CENTER, "--:--");
        return;
      }
      it.strftime(120, 70, id(font_clock), Color::WHITE, TextAlign::CENTER, "%H:%M", now);
      it.strftime(120, 170, id(font_info), Color(120, 160, 255), TextAlign::CENTER, "%a %d %b %Y", now);
      // status line: shows the armed alarm time, or "Alarm off".
      if (id(g_alarm_enabled)) {
        it.printf(120, 200, id(font_info), Color(120, 255, 120), TextAlign::CENTER,
                  "Alarm %02d:%02d", id(g_alarm_hour), id(g_alarm_minute));
      } else {
        it.printf(120, 200, id(font_info), Color(120, 120, 120), TextAlign::CENTER, "Alarm off");
      }


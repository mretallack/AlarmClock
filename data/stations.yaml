# Internet radio station catalogue (design.md §10.4, task A4)
#
# Consumed by the firmware and tools/mqtt_sim.py. "Feed only radio stations":
# HA's `select.station` is populated from this list.
#
# Preferences for reliability on the ESP32 (see design.md §10.2):
#   - direct MP3 (or AAC) ICY/Icecast streams
#   - plain HTTP where possible (HTTPS costs RAM/CPU on the S3)
#   - avoid HLS/DASH (not supported by the ESP audio stack)
#   - must return `Content-Type: audio/mpeg` WITHOUT a User-Agent
#     (ESPHome's AudioReader sends none; stations that 403 without a UA won't work)
#
# Verified 2026-11-20: all entries below return `audio/mpeg` with no User-Agent.
# SomaFM was dropped (403 Forbidden without a UA); BBC legacy URLs now 302 to a
# notice page; Jazz24 endpoint did not resolve.

stations:
  - id: radioparadise-mp3
    name: Radio Paradise
    url: http://stream.radioparadise.com/mp3-128
    codec: mp3
    bitrate: 128

  - id: classicfm
    name: Classic FM
    url: http://media-ice.musicradio.com/ClassicFMMP3
    codec: mp3
    bitrate: 128

  - id: heart-london
    name: Heart London
    url: http://icecast.thisisdax.com/HeartLondonMP3
    codec: mp3
    bitrate: 128

  - id: capital-fm
    name: Capital FM
    url: http://icecast.thisisdax.com/CapitalMP3
    codec: mp3
    bitrate: 128

  - id: smooth-london
    name: Smooth London
    url: http://icecast.thisisdax.com/SmoothLondonMP3
    codec: mp3
    bitrate: 128

  - id: lbc
    name: LBC
    url: http://icecast.thisisdax.com/LBCUKMP3
    codec: mp3
    bitrate: 128

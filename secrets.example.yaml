# Example secrets for ESPHome. Copy to secrets.yaml and fill in.
# secrets.yaml is git-ignored — never commit real credentials.

wifi_ssid: "MyHomeNetwork"
wifi_password: "supersecret"

# Fallback AP (captive portal) password, min 8 chars
wifi_ap_password: "alarmclock-fallback"

# MQTT broker (Home Assistant Mosquitto add-on by default)
mqtt_broker: "homeassistant.local"
mqtt_port: 1883
mqtt_username: "mqtt-user"
mqtt_password: "mqtt-password"

# Optional: encrypt OTA / API (if used)
ota_password: "ota-password"

# Native API encryption key (generate: openssl rand -base64 32)
# Use "" to disable encryption, or remove the api: block in alarmclock.yaml.
# The value below is a valid-format placeholder (32 zero bytes) — REPLACE IT.
api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="